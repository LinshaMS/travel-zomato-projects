    <head>
        <title>Bootstrap Card</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            .card img{
            height:200px;
            object-fit:cover;
            
        }

        .card{
            transition:0.5s;
        }

        .card:hover{

        }
        </style>
    </head>
