<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Design</title>

    <style>

        body{
            margin:0;

            font-family:sans-serif;

            background:lightgray;
        }


        .main{
            display:flex;

            justify-content:center;

            gap:20px;

            padding:50px;
        }


        .box{
            width:300px;

            height:250px;

            background:purple;

            color:white;

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:30px;

            border-radius:20px;

            transition:0.5s;
        }


        .box:hover{
            transform:scale(1.1);

            background:deeppink;
        }


        /* RESPONSIVE DESIGN */

        @media(max-width:700px){

            .main{
                flex-direction:column;

                align-items:center;
            }


            .box{
                width:90%;

                background:darkblue;
            }
        }

    </style>

</head>

<body>

    <div class="main">

        <div class="box">
            Box 1
        </div>


        <div class="box">
            Box 2
        </div>


        <div class="box">
            Box 3
        </div>

    </div>

</body>

</html>
