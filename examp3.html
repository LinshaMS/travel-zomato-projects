<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Image Gallery</title>
        <style>
            .container{
                display:flex;
                gap:20px;
                flex-wrap:wrap;
                justify-content:center;
                margin-top:150px;
            }
            .main{
                width:20%;
                height:400px;
                margin:auto;
                border-radius:10px;
                box-shadow:2px 3px 4px;
                outline:2px solid gray;
                outline-offset:5px;
                
                
            }
            .main img{
                width:100%;
                height:70%;
                border-radius:10px;
            }
            .main p{
                text-align:center;
                padding:10px;
                align-content:center;
            }
         h1{
            text-align:center;
            color:purple;
         }
        
        </style>
    </head>
    <body>
        <h1>Image Gallery</h1>

        <div class="container">
        <div class="main">
            <img src="rose.jpg">
            <p> A delicate pink rose in full bloom,symbolizing grace,admiration and sweetness. </p>
        </div>
        <div class="main">
            <img src="flower.jpg">
            <p> The photo highlights the beauty and freshness of the flower.</p>
        </div>
            <div class="main">
                <img src="butterfly.jpg">
                <p> The photo highlights the beauty and freshness of the flower.</p>
            </div>
    </body>
</html>
