<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Website</title>

    <style>

        body{
            background:lightgray;
        }

        .main{

            width:80%;

            height:720px;

            background:lightgreen;

            margin:auto;

            margin-top:40px;

            border-radius:10px;
        }

        .container{

            display:flex;

            gap:40px;

            padding:35px;
        }

        .sub{

            width:30%;

            height:620px;

            background:darkgreen;

            position:relative;
        }

        .sub1{

            width:220px;

            height:80px;

            background:seagreen;

            color:white;

            text-align:center;

            font-size:20px;

            position:absolute;

            left:0;

            top:280px;
        }

        .sub2{

            width:70%;

            height:620px;

            background:seagreen;

            padding-left:30px;
        }

        .sub2 h1{

            color:white;

            font-size:60px;

            margin-top:20px;
        }

        .sub2 h2{

            font-size:18px;

            margin-left:300px;

            margin-top:-80px;

            color:white;
        }

        .sub2 h3{

            font-size:45px;

            margin-top:40px;
        }

        .sub3{

            display:flex;

            gap:70px;

            margin-top:30px;
        }

        .sub3 input{

            width:230px;

            height:30px;

            margin-bottom:15px;
        }

        label{

            color:white;

            font-size:18px;
        }

        p{

            color:white;

            font-size:18px;

            margin-top:30px;
        }

        button{

            width:230px;

            height:40px;

            background:darkgreen;

            color:white;

            border:none;

            font-size:18px;

            margin-top:10px;
        }

        span{

            color:black;
        }

        .sub4{

            display:flex;

            gap:20px;

            margin-top:5px;
        }

        .sub5{

            width:230px;

            height:40px;

            background:white;

            text-align:center;

            font-size:20px;
        }

        .sub6{

            width:230px;

            height:40px;

            background:white;

            text-align:center;

            font-size:20px;
        }

    </style>

</head>

<body>

    <div class="main">

        <div class="container">

            <div class="sub">

                <div class="sub1">

                    <p>
                        Let's Make it Happen Together!
                    </p>

                </div>

            </div>

            <div class="sub2">

                <h1>CO.</h1>

                <h2>
                    Already have an account? Sign in here
                </h2>

                <h3>
                    Create An Account
                </h3>

                <div class="sub3">

                    <div>

                        <label>First Name</label><br>

                        <input type="text" placeholder="First Name"><br>

                        <label>Email</label><br>

                        <input type="email" placeholder="Email"><br>

                        <label>Create Password</label><br>

                        <input type="password" placeholder="Password">

                    </div>

                    <div>

                        <label>Last Name</label><br>

                        <input type="text" placeholder="Last Name"><br>

                        <label>Address</label><br>

                        <input type="text" placeholder="Address"><br>

                        <label>Confirm Password</label><br>

                        <input type="password" placeholder="Confirm Password">

                    </div>

                </div>

                <p>
                    <input type="checkbox">

                    Creating your account and accepting <span>Terms & Conditions</span>
                </p>

                <button>
                    Create account <br>

                </button>

                <div class="sub4">

                    <div class="sub5">
                        <i class="fa-brands fa-facebook"></i>
                        Sign Up using Facebook
                    </div>

                    <div class="sub6">
                        <i class="fa-brands fa-twitter"></i>
                        Sign Up using Twitter
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
