<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to CSS Design</title>
    <style>

        body{
            background:linear-gradient(90deg, blue,pink);
            border-radius:10px;
        }

        .main{

            width:60%;
            height:500px;
            background:white;
            text-align:center;
            border-radius:10px;
            border-right:4px;
            padding:20px;
            margin:auto;
            margin-top:70px;
            margin-bottom:50px;
            box-shadow:2px 4px 5px;
        }
        h1{
            text-transform:uppercase;
            text-decoration-line: underline;
            font-size:25px;
            color:grey;
        }
        .main p{
            text-align:center;
            font-size:20px;
            color:rgb(18, 97, 92);

        }
        .sub {
            width:50%;
            height:50px;
            box-shadow: 2px 3px 5px lightgrey;
            border-radius:10px;
            border-left:5px;
            padding:10px;
            margin-left:auto;
            margin-right:auto;

        }

        .sub p{
            text-align:center;
            font-size:18px;
            color:rgb(18, 97, 92);
        }
        
        img{
            width:50%;
            height:250px;
            box-shadow:2px 4px 10px;
        }

    </style>

</head>
<body>

    <div class="main">
        <h1>Welcome To CSS Design</h1>
        <p> This is a simple example showing text styling,fonts, background, div,and image properties using CSS.</p>
        <img src="https://up.yimg.com/ib/th/id/OIP.qSIj2nBaNlkZT72M3Ss6KgHaE7?pid=Api&rs=1&c=1&qlt=95&w=147&h=98">
        <br><br>
        <div class="sub">
              <p>This is a styled div(card).It uses background color and a border highlight.</p>
        </div>
    </div>

</body>
</html>
