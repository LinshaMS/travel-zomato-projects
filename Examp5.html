<!DOCTYPE html>
<html lang="en">

<head>

    <title>learningrobo</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <style>

        .container{

            background:linear-gradient(90deg,skyblue,lightgreen);

            display:flex;

            justify-content:center;

            margin-top:100px;
        }

        .main{

            width:20%;

            height:500px;

            background:linear-gradient(black 30%,aqua 30%);

            border-radius:20px;

            box-shadow:2px 3px 4px gray;

            text-align:center;
        }

        .sub{

            width:100px;

            height:100px;

            background:white;

            border-radius:50%;

            margin:auto;

            margin-top:40px;

            outline:2px solid gray;

            outline-offset:5px;
        }

        .sub i{

            font-size:60px;

            color:black;

            padding-top:20px;
        }

        .sub2{

            text-align:center;

            padding-top:20px;
        }

        .sub2 h1{

            padding-top:20px;
        }

        .icon i{

            font-size:25px;

            margin:10px;

            background:white;

            border-radius:50%;

            padding:10px;
        }

        button{

            width:70%;

            height:40px;

            border-radius:30px;

            background:white;

            color:black;

            font-size:20px;

            font-weight:bold;

            margin-top:20px;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="main">

            <div class="sub">

                <i class="fa-regular fa-user"></i>

            </div>

            <div class="sub2">

                <h1>learningrobo</h1>

                <p>@pacificcreation</p>

                <div class="icon">

                    <i class="fa-brands fa-facebook"></i>

                    <i class="fa-brands fa-instagram"></i>

                    <i class="fa-brands fa-linkedin"></i>

                </div>

                <h2>Snippet for Web Developers</h2>

                <button>Message</button>

            </div>

        </div>

    </div>

</body>

</html>
