<!DOCTYPE html>

<html lang="en">

<head>

    <title>Animation Example</title>

    <style>

    
        .move{

            width:120px;

            position:absolute;

            top:46%;

            animation:move 10s ease-out 5;
        }

        @keyframes move{

            from{

                transform:translateX(0%);
            }

            to{

                transform:translateX(90%);
            }

        }

        .road{

            width:100%;

            height:80px;

            background:black;

            position:absolute;

            top:50%;
        }

    </style>

</head>

<body>

    <img src="car.jpg" class="move">

    <div class="road"></div>

</body>

</html>
