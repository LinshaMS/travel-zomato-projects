<!DOCTYPE html>
<html lang="en">

<head>
    <title>Watch Card</title>
    <style>
        body{
        background:#f1f1f1;
        }
        .main{
            width:80%;
            height:500px;
            background:white;
            margin:auto;
            margin-top:50px;
            border-radius:20px;
            box-shadow:2px 3px 10px gray;
        }
        .container{
            display:flex;
            gap:50px;
            padding:30px;
        }
        .sub{
            width:40%;
            height:400px;
        }
        .sub img{
            width:100%;
            height:100%;
            border-radius:20px;
        }
        .sub1{
            width:50%;
            height:400px;
            margin-top:30px;
        }
        .sub1 h3{
            color:blue;
        }
        .sub1 h1{
            font-size:40px;
        }
        .sub1 h2{
            font-size:35px;
        }
        .sub1 p{
            font-size:20px;
            color:gray;
        }
        button{
            width:180px;
            height:50px;
            background:blue;
            color:white;
            border:none;
            border-radius:10px;
            font-size:20px;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="container">
            <div class="sub">
                <img src="watch.jpg">
            </div>
            <div class="sub1">
                <h3>WATCHES</h3>
                <h1>Premium Analog Watch</h1>
                <p>****** (128 reviews)</p>
                <h2>₹2,499</h2>
                <p>
                    Stylish analog watch with a premium leather strap and water resistant design.
                </p>

                <button>Add to Cart</button>
            </div>
        </div>
    </div>
</body>
</html>
