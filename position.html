<!DOCTYPE html>
<html lang="en">
   <head>
    <title>Position</title>
    <style>
    .static{
     position:static;
     border:2px solid black;
     background-color:pink;
     padding:20px;
    }
      .absolute{
       position:absolute;
       border:2px solid black;
       background-color:orange;
       top:200px;
       right:50px;
       padding:20px;
    }
   .fp{
    position:fixed;
    border:2px solid black;
    background-color:lightblue;
    width:30%;
    height:40px;
    right:0;
    bottom:0;


   }
   .sticky{
    position:sticky;
    top:0;
    border:1px solid black;

   }
   .rl{
    position:relative;
    border:1px solid black;
    background-color:lightgreen;
    width:auto;
    top:20px;
    left:20px;
   }
    </style>
   </head>
   <body>
     <div class="static">

        This is Static Position

    </div>
    <br><br><br>

    <div class="absolute">

        This is Absolute Position

    </div>

     <div class="sticky">

        This is Sticky Position

    </div>

    <div class="rl">

        This is Relative Position

    </div>

    <div class="fp">

        This is Fixed Position

    </div>
   </body>
</html>
