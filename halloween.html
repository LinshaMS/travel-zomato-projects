<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Halloween Website</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="halloween.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand text-white" href="#">
            Halloween
        </a>

        <!-- TOGGLE BUTTON -->

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <!-- MENU -->

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        About Us
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Portfolio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        Contact Us
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>



<!-- HOME SECTION -->

<section class="home">

    <div class="container">

        <div class="home-content text-center">

            <!-- BACKGROUND POINTS -->

            <img src="home-point.png"
                 class="points">

            <!-- MOON -->

            <img src="home-moon.png"
                 class="moon">

            <!-- TEXT -->

            <h4 class="subtitle">
                TRICK OR TREAT
            </h4>

            <h1 class="home-title">
                HALLOWEEN
            </h1>

            <!-- PUMPKIN -->

            <img src="home-pumpkin.png"
                 class="pumpkin">

            <!-- DESCRIPTION -->

            <p class="text-white description">

                Halloween is celebrated every October 31 at night,
                walk through the city with your friends and enjoy
                trick or treating, spend a terrifying night under
                the full moon.

            </p>

            <!-- BUTTON -->

            <button class="btn btn-primary px-4 py-2">
                CLICK HERE
            </button>

            <!-- TREES -->

            <img src="home-trees.png"
                 class="trees">

            <!-- GRASS -->

            <img src="home-grass.png"
                 class="grass">

        </div>

    </div>

</section>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
