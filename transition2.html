<!DOCTYPE html>
<html lang="en">
<head>
    <title>Card Flip Animation</title>
<style>
    body{
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        background:white;
        font-family:sans-serif;
    }

    .card-container{

        /*creates a 3D world */

        perspective:1000px;
    }

    .card{
        width:300px;
        height:400px;
        position:relative;
        transform-style:preserve-3d;
        transition:transform 1s;
        cursor:pointer;
    }

    /*flip effect*/

    .card-container:hover .card{
        transform:rotateY(180deg);
    }

    /*front and back side of the card*/

    .card-front,.card-back{
        position:absolute;
        width:100%;
        height:100%;
        border-radius:10px;
        overflow:hidden;
        backface-visibility:hidden;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }
    .card-front img{
        width: 100%;
        height: 100%;
        object-fit:contain;
    }
    .card-back{
        background:linear-gradient(45deg, #ff6b6b, #f06595);
        color:red;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        gap:10px;
        text-align:center;
        transform:rotateY(180deg);
    }

    .card-back h2{
        font-size:24px;
        margin:0;
    }
    .card-back h3{
        font-size:18px;
        margin:0;
    }
</style>
</head>
<body>

    <div class="card-container">
        <div class="card">
            <div class="card-front">
                <img src="https://cdn-icons-png.flaticon.com/512/415/415733.png">
            </div>

            <div class="card-back">
                <h2>Name: Stranger</h2>
                <h3>Developer</h3>
            </div>
        </div>
    </div>

</body>
</html>
