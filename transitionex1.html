<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Transition Example</title>
        <style>
            body{
                background:skyblue;
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;

            }

            .container{
                width:100px;
                height:100px;
                border:2px solid white;
                position:relative;
            }
            .box{
                width:100px;
                height:100px;
                background-color:white;
                animation: move 3s;
            }
            @keyframes move{
                0%{
                    transform:translate(0,0);
                }
                25%{
                    transform:translate(300px,0);
                }
                50%{
                    transform:translate(300px,300px);
                }
                75%{
                    transform:translate(0,200px);

                }
                100%{
                    transform:translate(0,0);
    
                }
            }
         
           
        </style>
        <body>
            <div class="container">
                <div class="box"></div>
            </div>
        </body>
    </head>
</html>
