<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Example</title>
    <style>
       div{
          border-radius:10px;
          border-top:3px solid red;
          border-bottom:3px dashed blue;
          border-right:3px dotted green;
          border-left:3px double black;

       }
        
    </style>

</head>
<body>
    <div>Hello world</div>
</body>
</html>
